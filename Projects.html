    const modal = document.getElementById('project-modal');
    const modalTitle = document.getElementById('modal-title');
    const modalDescription = document.getElementById('modal-description');
    const modalTech = document.getElementById('modal-tech');
    const modalImage = document.getElementById('modal-image');
    const closeButton = document.querySelector('.modal-close');

    function openModal(projectKey) {
        const project = projectData[projectKey];
        if (!project) return;

        modalTitle.textContent = project.title;
        modalDescription.textContent = project.description;
        modalImage.src = projectKey === 'project1' ? 'main-picture.png' : project.image;
        modalImage.alt = project.title;
        modalTech.innerHTML = '';
        project.tech.forEach(item => {
            const li = document.createElement('li');
            li.textContent = item;
            modalTech.appendChild(li);
        });

        modal.classList.remove('hidden');
        modal.setAttribute('aria-hidden', 'false');
    }

    function closeModal() {
        modal.classList.add('hidden');
        modal.setAttribute('aria-hidden', 'true');
    }

    document.querySelectorAll('.project-card-link').forEach(link => {
        link.addEventListener('click', (event) => {
            event.preventDefault();
            openModal(link.dataset.project);
        });
    });

    const projectKeyFromUrl = window.location.hash.slice(1);
    if (projectData[projectKeyFromUrl]) openModal(projectKeyFromUrl);

    closeButton.addEventListener('click', closeModal);
    modal.addEventListener('click', (event) => {
        if (event.target === modal) closeModal();
    });
    window.addEventListener('keydown', (event) => {
        if (event.key === 'Escape' && !modal.classList.contains('hidden')) {
            closeModal();
        }
    });
